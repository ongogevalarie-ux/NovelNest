<!DOCTYPE html>
<html>
<head>
    <title>Create Account</title>
</head>

<body>

    <h1>📚 Create Your NovelNest Account</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Create Account
        </button>

    </form>

    <p>
        Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </p>

</body>
</html>
